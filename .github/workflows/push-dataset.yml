name: Synch uploaded jsonl files to HuggingFace

# Manual only for now: nothing schedules or calls this workflow. Whether to run it automatically
# (e.g. after the weekly fetch) is still open, see #256.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check the token and save the files as a workflow artifact instead of uploading them'
        type: boolean
        default: true
      datasource:
        description: 'The datasource to process'
        type: choice
        default: all
        options:
          - all
          - agentmodels
          - agisf
          - aisafety.info
          - alignment_newsletter
          - alignmentforum
          - arbital
          - arxiv
          - blogs
          - distill
          - eaforum
          - indices
          - lesswrong
          - special_docs
          - youtube

jobs:
  generate-dataset:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Python environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate dataset file
      env:
        ARD_DB_USER: ${{ secrets.ARD_DB_USER }}
        ARD_DB_PASSWORD: ${{ secrets.ARD_DB_PASSWORD }}
        ARD_DB_HOST: ${{ secrets.ARD_DB_HOST }}
        ARD_DB_NAME: alignment_research_dataset
      run: python main.py generate_jsonl_files ${{ inputs.datasource }}

    - name: Setup Huggingface client
      run: pip install huggingface_hub

    - name: Upload files
      env:
        HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: python upload_to_huggingface.py ${{ inputs.datasource }} ${{ inputs.dry_run && '--dry-run' || '' }}

    - name: Save dry run output
      if: inputs.dry_run
      uses: actions/upload-artifact@v7
      with:
        name: huggingface-dry-run
        path: data/huggingface/
        retention-days: 7
