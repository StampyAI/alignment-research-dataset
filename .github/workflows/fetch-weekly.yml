name: Daily dataset updates (formerly weekly)
on:
  workflow_dispatch: # allow manual triggering
  schedule:
    - cron: "0 1 * * *"  # Every day at 01:00, after the other daily fetch starts

jobs:
  fetch_and_index:
    strategy:
      fail-fast: false
      matrix:
        datasource: ${{ fromJson(vars.WEEKLY_DATASOURCES) }}

    uses: ./.github/workflows/fetch-and-index-datasource.yml
    with:
      datasource: ${{ matrix.datasource }}
    secrets: inherit
